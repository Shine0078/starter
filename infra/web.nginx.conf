server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Flutter routes are client-side paths. Static assets still win, while a
  # deep link falls back to the compiled index page. Revalidation avoids a
  # stale Flutter bundle while conditional requests let an unchanged CanvasKit
  # renderer be reused instead of downloaded on every app launch.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
