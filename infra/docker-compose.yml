name: finverse

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: finverse
      POSTGRES_PASSWORD: finverse_dev_only
      POSTGRES_DB: finverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finverse -d finverse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
