steps:
  # Dockerfile.public packages the NestJS API and the Flutter PWA in one
  # same-origin image. Cloud Run supplies PORT at runtime.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.public
      - -t
      - ${_IMAGE}
      - --build-arg
      - GIT_SHA=${_GIT_SHA}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _GIT_SHA: unknown
