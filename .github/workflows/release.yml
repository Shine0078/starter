name: Release artifacts

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA that already passed CI
        required: true
        type: string

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: release-artifacts-${{ github.event.workflow_run.head_sha || inputs.sha }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify candidate SHA passed CI
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          MANUAL_SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            test "$RUN_CONCLUSION" = "success"
            test -n "$RUN_HEAD_SHA"
            case "$RUN_HEAD_BRANCH" in
              main|master) ;;
              *)
                echo "Skipping automatic release for branch $RUN_HEAD_BRANCH"
                exit 1
                ;;
            esac
            SHA="$RUN_HEAD_SHA"
          else
            SHA="$MANUAL_SHA"
          fi
          test "${#SHA}" -eq 40
          MATCH=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&status=completed&per_page=30" --jq '.workflow_runs | map(select(.name=="CI" and .conclusion=="success" and .head_sha=="'"$SHA"'" and (.head_branch=="main" or .head_branch=="master") and .head_repository.full_name=="'"$REPO"'")) | length')
          test "$MATCH" -gt 0
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Releasing verified SHA $SHA"

  api-image:
    name: Publish API image to GHCR
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a9004284286 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=${{ needs.gate.outputs.sha }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            GIT_SHA=${{ needs.gate.outputs.sha }}

  android:
    name: Build Android release APK
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get
      - name: Configure Android upload signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" && test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > apps/mobile/android/key.properties
      - name: Build Android release
        working-directory: apps/mobile
        shell: bash
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "$API_BASE_URL"
          case "$API_BASE_URL" in
            https://finverse.onrender.com|http://finverse.onrender.com|https://finverse.onrender.com/*)
              echo "API_BASE_URL still points at the retired Render placeholder." >&2
              exit 1
              ;;
          esac
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "API_BASE_URL must be an https origin." >&2; exit 1 ;;
          esac
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finverse-android-${{ needs.gate.outputs.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  web:
    name: Build installable web/PWA bundle
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get
      - name: Build same-origin web bundle
        working-directory: apps/mobile
        run: flutter build web --release --no-web-resources-cdn --base-href=/app/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finverse-web-${{ needs.gate.outputs.sha }}
          path: apps/mobile/build/web
          if-no-files-found: error
