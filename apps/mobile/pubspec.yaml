name: finverse
description: FINVERSE — AI-powered personal finance. Android and iOS client.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.19.0
  cryptography: ^2.9.0
  sqflite: ^2.4.3
  # Session tokens go in the platform keystore (Keychain / EncryptedSharedPreferences),
  # not shared preferences. A refresh token is a long-lived credential for
  # someone's bank data.
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
